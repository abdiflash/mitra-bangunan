<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Pemindai Secure - Mitra Bangunan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; }
        .success-flash { background-color: #059669 !important; }
    </style>
</head>
<body id="mainBody" class="text-slate-100 min-h-screen pb-12 transition-colors duration-300">

    <!-- HEADER NAVIGATION -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-xl">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-emerald-500/20 shrink-0">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-sm sm:text-base text-white leading-tight">Terminal Kasir Safe-Guard</h1>
                    <p class="text-[11px] text-emerald-400 font-semibold" id="activeStoreHeader">TB. Maju Jaya Makmur</p>
                </div>
            </div>

            <!-- AKSI SHIFT KASIR & LIVE COUNTER BONUS -->
            <div class="flex items-center gap-2 flex-wrap">
                <!-- INDIKATOR KASIR AKTIF SHIFT -->
                <div class="bg-slate-800/90 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-user-check text-emerald-400 text-xs"></i>
                    <div class="text-left">
                        <span class="text-[9px] text-slate-400 block font-semibold leading-tight">Kasir Shift:</span>
                        <strong id="activeCashierName" class="text-xs text-white font-bold block">Kardi</strong>
                    </div>
                    <button onclick="changeActiveCashier()" class="text-[10px] bg-slate-700 hover:bg-slate-600 text-emerald-300 font-bold px-2 py-0.5 rounded-lg ml-1 transition border border-slate-600">
                        Ganti
                    </button>
                </div>

                <!-- BONUS INSENTIF SHIFT INI (0.2%) -->
                <div class="text-right bg-blue-950/80 border border-blue-500/40 px-3 py-1.5 rounded-xl shadow-sm">
                    <span class="text-[9px] text-blue-300 block font-bold leading-tight uppercase tracking-wider">Bonus Shift Ini</span>
                    <strong id="kasirBonusCounter" class="text-xs sm:text-sm font-black text-blue-400 block">Rp 0</strong>
                </div>

                <!-- TOMBOL REKAP SHIFT WA -->
                <button onclick="sendShiftWaReport()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs px-3 py-2 rounded-xl transition inline-flex items-center gap-1 shadow-lg">
                    <i class="fa-brands fa-whatsapp text-sm"></i> Rekap WA
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-4 space-y-4">

        <!-- CAMERA SCANNER & INPUT MANUAL -->
        <section class="bg-slate-800/90 rounded-2xl p-4 sm:p-5 border border-slate-700 text-center space-y-4 shadow-2xl">
            <h2 class="font-bold text-slate-200 text-xs sm:text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-qrcode text-emerald-400"></i> Pindai / Scan QR Invoice Pelanggan
            </h2>

            <div id="readerBox" class="max-w-sm mx-auto overflow-hidden rounded-2xl border-2 border-dashed border-slate-600 bg-slate-950 p-2 min-h-[200px] flex flex-col justify-center items-center">
                <div id="reader" class="w-full"></div>
            </div>

            <div class="flex justify-center gap-2">
                <button id="btnStartScan" onclick="startScanner()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-lg transition flex items-center gap-1.5">
                    <i class="fa-solid fa-camera"></i> Buka Kamera HP/PC
                </button>
                <button id="btnStopScan" onclick="stopScanner()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold text-xs px-4 py-2.5 rounded-xl hidden transition">
                    Matikan Kamera
                </button>
            </div>

            <!-- Manual Input Hardware Barcode Scanner -->
            <div class="pt-3 border-t border-slate-700/60 max-w-sm mx-auto">
                <div class="flex gap-2">
                    <input type="text" id="manualTrxId" onkeypress="handleEnterKey(event)" placeholder="Ketik / USB Scan ID (Contoh: MB-846563)" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-xs font-mono font-bold text-emerald-400 focus:border-emerald-500 focus:outline-none">
                    <button id="btnCariManual" onclick="lookupManualTrx()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-magnifying-glass"></i> Cari
                    </button>
                </div>
            </div>
        </section>

        <!-- VERIFICATION CARD SECTION -->
        <section id="resultSection" class="hidden bg-slate-800 rounded-2xl p-4 sm:p-6 border border-slate-700 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <div>
                    <span id="resTrxId" class="text-xs font-mono font-extrabold text-emerald-400 block">MB-000000</span>
                    <h3 id="resCustName" class="text-base font-bold text-white">Pelanggan: Umum</h3>
                </div>
                <span id="resStatusBadge" class="bg-amber-500/20 text-amber-300 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30">PENDING</span>
            </div>

            <!-- INSTRUCTION CARD -->
            <div id="cashierInstructionCard" class="p-4 rounded-xl border space-y-1">
                <strong id="instructionTitle" class="text-xs font-bold uppercase flex items-center gap-2"></strong>
                <p id="instructionText" class="text-xs font-medium leading-relaxed"></p>
            </div>

            <!-- ITEM BREAKDOWN TABLE -->
            <div class="border border-slate-700 rounded-xl overflow-hidden bg-slate-900/50">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="p-2.5">Material</th>
                            <th class="p-2.5 text-center">Qty</th>
                            <th class="p-2.5 text-right">Harga</th>
                            <th class="p-2.5 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="resTableBody" class="divide-y divide-slate-800 text-slate-300"></tbody>
                </table>
            </div>

            <!-- FORM OTENTIKASI & UPLOAD FOTO STRUK -->
            <div id="cashierAuthBox" class="bg-slate-900/80 p-4 rounded-xl border border-slate-700 space-y-3">
                <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wide flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-emerald-400"></i> Akuntabilitas Kasir & Bukti Fisik
                </h4>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Nama Kasir Bertugas <span class="text-rose-400">*</span></label>
                        <input type="text" id="inputCashierName" placeholder="Nama Kasir (Contoh: Budi)" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">No. Struk Fisik Toko <span class="text-rose-400">*</span></label>
                        <input type="text" id="inputStrukNo" placeholder="Contoh: STR-20261102-01" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500 focus:outline-none font-mono">
                    </div>
                </div>

                <!-- AMBIL FOTO STRUK FISIK (KAMERA HP/LAPTOP) -->
                <div class="pt-2 border-t border-slate-800">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Foto Struk / Nota Fisik Belanja <span class="text-rose-400">*Wajib Bukti Foto</span></label>
                    <div class="flex items-center gap-3">
                        <input type="file" id="inputFotoStruk" accept="image/*" capture="environment" class="hidden" onchange="handleImageCapture(event)">
                        <button type="button" onclick="document.getElementById('inputFotoStruk').click()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-2">
                            <i class="fa-solid fa-camera text-emerald-400"></i> <span id="btnFotoLabel">Ambil Foto Struk</span>
                        </button>
                        <div id="previewContainer" class="hidden relative w-12 h-12 rounded-lg border border-emerald-500 overflow-hidden">
                            <img id="imgPreview" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>
            </div>

            <!-- ACTION BAR -->
            <div class="bg-slate-900 p-4 rounded-xl flex flex-wrap items-center justify-between gap-3 border border-slate-700">
                <div>
                    <span class="text-[11px] text-slate-400 font-medium block">Total Pembayaran Kasir:</span>
                    <strong id="resFinalTotal" class="text-xl font-black text-emerald-400">Rp 0</strong>
                </div>
                <div id="actionBarButtons" class="flex items-center gap-2">
                    <button id="btnVerify" onclick="verifyTrx()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs px-5 py-3 rounded-xl shadow-lg transition flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-base"></i> SELESAIKAN TRANSAKSI
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxsQQMYsvWk6R3AkPhkEURDsxFaEyUnqwFyCv500uPYvK0Y0RhPvaHXgw5OcvYeH_tC/exec";
        
        let html5QrcodeScanner = null;
        let currentLoadedTrx = null;
        let compressedBase64Image = "";
        let terminalToken = "";

        // STATE KASIR SHIFT AKTIF & AKUMULASI LAPORAN
        let currentCashier = localStorage.getItem('MB_ACTIVE_CASHIER') || 'Kardi';
        let shiftTrxCount = 0;
        let shiftTotalOmzet = 0;
        let accumulatedKasirBonus = 0;

        window.addEventListener('DOMContentLoaded', () => {
            initTerminalToken();
            updateCashierUI();
        });

        function initTerminalToken() {
            let token = localStorage.getItem('MB_TERMINAL_TOKEN');
            if (!token) {
                token = 'TERM-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                localStorage.setItem('MB_TERMINAL_TOKEN', token);
            }
            terminalToken = token;
        }

        // TAMPILKAN KASIR AKTIF DI HEADER & AUTO-FILL INPUT FORM
        function updateCashierUI() {
            const cashierLabel = document.getElementById('activeCashierName');
            if (cashierLabel) cashierLabel.innerText = currentCashier;
            
            const nameEl = document.getElementById('inputCashierName');
            if (nameEl) nameEl.value = currentCashier;
        }

        // FUNGSI GANTI KASIR SHIFT
        function changeActiveCashier() {
            const inputName = prompt("Masukkan Nama Staf Kasir yang Bertugas Shift Ini:", currentCashier);
            if (inputName && inputName.trim() !== "") {
                currentCashier = inputName.trim();
                localStorage.setItem('MB_ACTIVE_CASHIER', currentCashier);
                
                // Reset Statistik Shift untuk Kasir Baru
                shiftTrxCount = 0;
                shiftTotalOmzet = 0;
                accumulatedKasirBonus = 0;
                
                updateCashierUI();
                document.getElementById('kasirBonusCounter').innerText = "Rp 0";

                alert(`✅ Sesi Kasir Aktif Diperbarui: ${currentCashier}`);
            }
        }

        // FUNGSI KIRIM REKAP SHIFT WA KE PEMILIK TOKO
        function sendShiftWaReport() {
            const ownerPhone = "6282113866890";
            const storeName = document.getElementById('activeStoreHeader')?.innerText || "TB. Maju Jaya Makmur";
            const dateStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });

            const textWa = `*REKAP SHIFT KASIR MITRA BANGUNAN*\n` +
                           `Nama Kasir : *${currentCashier}*\n` +
                           `Toko       : ${storeName}\n` +
                           `Tanggal    : ${dateStr}\n\n` +
                           `Total Transaksi Verified : *${shiftTrxCount} Transaksi*\n` +
                           `Total Omzet QR Handled   : *Rp ${shiftTotalOmzet.toLocaleString('id-ID')}*\n` +
                           `Hak Bonus Kasir (0.2%)   : *Rp ${Math.round(accumulatedKasirBonus).toLocaleString('id-ID')}*\n\n` +
                           `*Mohon dicatat untuk akumulasi gajian bulanan.*`;

            window.open(`https://api.whatsapp.com/send?phone=${ownerPhone}&text=${encodeURIComponent(textWa)}`, '_blank');
        }

        // Kompresi Foto Struk ke Base64 JPEG Ringan (<100KB)
        function handleImageCapture(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    compressedBase64Image = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('imgPreview').src = compressedBase64Image;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('btnFotoLabel').innerText = "Ganti Foto Struk";
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function startScanner() {
            document.getElementById('btnStartScan').classList.add('hidden');
            document.getElementById('btnStopScan').classList.remove('hidden');
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                onScanSuccess
            ).catch(err => alert("Gagal membuka kamera: " + err));
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('btnStartScan').classList.remove('hidden');
                    document.getElementById('btnStopScan').classList.add('hidden');
                });
            }
        }

        function onScanSuccess(decodedText) {
            stopScanner();
            let parsedId = decodedText;
            try {
                const parsed = JSON.parse(decodedText);
                if (parsed.trx) parsedId = parsed.trx;
            } catch(e) {}
            document.getElementById('manualTrxId').value = parsedId;
            fetchTrxDetails(parsedId);
        }

        function handleEnterKey(e) {
            if (e.key === 'Enter') lookupManualTrx();
        }

        function lookupManualTrx() {
            const val = document.getElementById('manualTrxId').value.trim().toUpperCase();
            if (!val) return alert('Masukkan ID Transaksi!');
            fetchTrxDetails(val);
        }

        async function fetchTrxDetails(trxId) {
            const btnCari = document.getElementById('btnCariManual');
            btnCari.disabled = true;
            btnCari.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const res = await fetch(`${GAS_WEB_APP_URL}?action=getTransaction&id=${trxId}`);
                const data = await res.json();
                if (data.success && data.trx) {
                    renderTrxDetails(data.trx, !!data.limitWarning);
                } else {
                    alert('Transaksi tidak ditemukan!');
                }
            } catch(e) {
                alert('Gagal terhubung ke server: ' + e.toString());
            } finally {
                btnCari.disabled = false;
                btnCari.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Cari';
            }
        }

        function renderTrxDetails(trx, isLimitExceeded = false) {
            currentLoadedTrx = trx;
            const resSec = document.getElementById('resultSection');
            resSec.classList.remove('hidden');

            document.getElementById('resTrxId').innerText = trx.id;
            document.getElementById('resCustName').innerText = `Pelanggan: ${trx.custName || 'Umum'}`;

            const isDone = String(trx.status).toUpperCase() === 'SELESAI';
            const badge = document.getElementById('resStatusBadge');
            badge.innerText = isDone ? 'SELESAI' : 'PENDING';
            badge.className = isDone
                ? 'bg-emerald-500/20 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30'
                : 'bg-amber-500/20 text-amber-300 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30';

            const card = document.getElementById('cashierInstructionCard');
            const title = document.getElementById('instructionTitle');
            const text = document.getElementById('instructionText');

            let subtotal = Number(trx.grandTotal || 0);
            let inc = Number(trx.incentiveVal) || Math.round(subtotal * 0.01);
            const isCashback = (trx.modeIncentive === 'CASHBACK_TUKANG' || trx.modeIncentive === 'KOMISI_TUKANG');

            if (isDone) {
                card.className = "p-4 rounded-xl border bg-emerald-950/40 border-emerald-500/40 text-emerald-200 space-y-1.5";
                title.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> TRANSAKSI SELESAI (VERIFIED)`;
                
                const komisiDetail = isCashback 
                    ? `💵 <strong>Komisi Tunai Tukang (1%): Rp ${inc.toLocaleString('id-ID')}</strong> (Telah Diserahkan Tunai ke Tukang)`
                    : `🏷️ <strong>Diskon Nota (1%): Rp ${inc.toLocaleString('id-ID')}</strong> (Telah Dipotongkan di Nota Belanja)`;

                text.innerHTML = `No. Struk Toko: <strong>${trx.strukNo || '-'}</strong> | Kasir: <strong>${trx.cashierName || '-'}</strong><br>${komisiDetail}`;
                document.getElementById('resFinalTotal').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
            } else {
                if (isCashback) {
                    card.className = "p-4 rounded-xl border bg-amber-950/40 border-amber-500/40 text-amber-200";
                    title.innerHTML = `<i class="fa-solid fa-hand-holding-dollar text-amber-400"></i> MODE: KOMISI TUNAI TUKANG (1%)`;
                    text.innerHTML = `1. Terima pembayaran penuh: <strong>Rp ${subtotal.toLocaleString('id-ID')}</strong>.<br>2. Serahkan komisi tunai <strong>Rp ${inc.toLocaleString('id-ID')}</strong> ke Tukang/Broker.`;
                    document.getElementById('resFinalTotal').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
                } else {
                    card.className = "p-4 rounded-xl border bg-emerald-950/40 border-emerald-500/40 text-emerald-200";
                    title.innerHTML = `<i class="fa-solid fa-percent text-emerald-400"></i> MODE: DISKON NOTA 1%`;
                    text.innerHTML = `Potong nota 1% (Rp ${inc.toLocaleString('id-ID')}).<br>Tagihkan ke pembeli: <strong>Rp ${(subtotal - inc).toLocaleString('id-ID')}</strong>`;
                    document.getElementById('resFinalTotal').innerText = `Rp ${(subtotal - inc).toLocaleString('id-ID')}`;
                }
            }

            const tbody = document.getElementById('resTableBody');
            tbody.innerHTML = (trx.items || []).map(it => `
                <tr>
                    <td class="p-2.5 font-semibold">${it.name}</td>
                    <td class="p-2.5 text-center">${it.qty} ${it.unit}</td>
                    <td class="p-2.5 text-right">Rp ${Number(it.price || 0).toLocaleString('id-ID')}</td>
                    <td class="p-2.5 text-right font-bold text-emerald-400">Rp ${Number(it.total || 0).toLocaleString('id-ID')}</td>
                </tr>
            `).join('');

            const authBox = document.getElementById('cashierAuthBox');
            const actionBarButtons = document.getElementById('actionBarButtons');

            if (isDone) {
                authBox.classList.add('hidden');
                actionBarButtons.innerHTML = `
                    <button onclick="sendWaResi()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow transition flex items-center gap-1.5">
                        <i class="fa-brands fa-whatsapp text-sm"></i> Kirim Resi WA
                    </button>
                    <button onclick="resetKasirUI()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition">
                        Scan Lagi
                    </button>
                `;
            } else {
                authBox.classList.remove('hidden');
                updateCashierUI();
                actionBarButtons.innerHTML = `
                    <button id="btnVerify" onclick="verifyTrx()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs px-5 py-3 rounded-xl shadow-lg transition flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-base"></i> SELESAIKAN TRANSAKSI
                    </button>
                `;
            }
        }

        async function verifyTrx() {
            if (!currentLoadedTrx) return;

            const nameEl = document.getElementById('inputCashierName');
            const strukEl = document.getElementById('inputStrukNo');

            const cashierName = nameEl ? nameEl.value.trim() : '';
            const strukNo = strukEl ? strukEl.value.trim() : '';

            if (!cashierName) return alert('Nama Kasir wajib diisi!');
            if (!strukNo) return alert('Nomor Struk Fisik Toko wajib diisi!');
            if (!compressedBase64Image) return alert('Wajib mengambil Foto Struk Fisik Belanja!');

            const btn = document.getElementById('btnVerify');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> MEMVERIFIKASI...`;

            const payload = {
                action: 'verifyTransaction',
                trxId: currentLoadedTrx.id,
                storeId: currentLoadedTrx.storeId,
                cashierName: cashierName,
                strukNo: strukNo,
                fotoStrukBase64: compressedBase64Image,
                terminalToken: terminalToken
            };

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const res = await response.json();

                if (!res.success) {
                    alert('Gagal Verifikasi: ' + res.message);
                    return;
                }

                // Kalkulasi Bonus Kasir 0.2% & Statistik Shift
                const grandTotal = Number(currentLoadedTrx.grandTotal || 0);
                const bonusAmt = grandTotal * 0.002;
                
                accumulatedKasirBonus += bonusAmt;
                shiftTrxCount += 1;
                shiftTotalOmzet += grandTotal;

                document.getElementById('kasirBonusCounter').innerText = "Rp " + Math.round(accumulatedKasirBonus).toLocaleString('id-ID');

                const inc = Number(currentLoadedTrx.incentiveVal) || Math.round(grandTotal * 0.01);
                const isCashback = (currentLoadedTrx.modeIncentive === 'CASHBACK_TUKANG' || currentLoadedTrx.modeIncentive === 'KOMISI_TUKANG');
                const komisiMsg = isCashback 
                    ? `Serahkan Komisi Tunai 1%: Rp ${inc.toLocaleString('id-ID')} ke Tukang`
                    : `Diskon Nota 1%: Rp ${inc.toLocaleString('id-ID')} (Sudah Dipotong Nota)`;

                alert(`✅ VERIFIKASI SELESAI!\n• ${komisiMsg}\n• Bonus Kasir (+0.2%): Rp ${Math.round(bonusAmt).toLocaleString('id-ID')}\n• Bukti Foto Terunggah ke Google Drive.`);

                currentLoadedTrx.status = 'SELESAI';
                currentLoadedTrx.cashierName = cashierName;
                currentLoadedTrx.strukNo = strukNo;
                renderTrxDetails(currentLoadedTrx, false);

            } catch(e) {
                alert('Gangguan Jaringan: ' + e.toString());
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-circle-check text-base"></i> SELESAIKAN TRANSAKSI`;
            }
        }

        // FUNGSI SEND WA RESI DENGAN BUKTI KOMISI TUKANG 1%
        function sendWaResi() {
            if (!currentLoadedTrx) return;
            let targetPhone = String(currentLoadedTrx.custPhone || '').replace(/[^0-9]/g, '');
            if (targetPhone.startsWith('0')) targetPhone = '62' + targetPhone.slice(1);
            else if (targetPhone.startsWith('8')) targetPhone = '62' + targetPhone;

            const subtotal = Number(currentLoadedTrx.grandTotal || 0);
            const inc = Number(currentLoadedTrx.incentiveVal) || Math.round(subtotal * 0.01);
            const isCashback = (currentLoadedTrx.modeIncentive === 'CASHBACK_TUKANG' || currentLoadedTrx.modeIncentive === 'KOMISI_TUKANG');
            
            const komisiDetail = isCashback
                ? `• Mode: CASHBACK TUNAI TUKANG (1%)\n• Nominal Komisi: *Rp ${inc.toLocaleString('id-ID')}*\n• Status: *TELAH DISERAHKAN TUNAI OLEH KASIR*`
                : `• Mode: DISKON NOTA BELANJA (1%)\n• Nominal Diskon: *Rp ${inc.toLocaleString('id-ID')}*\n• Status: *TELAH DIPOTONGKAN DI NOTA*`;

            const msg = `*BUKTI VERIFIKASI & KOMISI MITRA BANGUNAN*\n\n` +
                        `ID Transaksi : *${currentLoadedTrx.id}*\n` +
                        `Total Belanja: *Rp ${subtotal.toLocaleString('id-ID')}*\n` +
                        `No. Struk    : ${currentLoadedTrx.strukNo || '-'}\n` +
                        `Kasir        : ${currentLoadedTrx.cashierName || '-'}\n\n` +
                        `----------------------------------------\n` +
                        `*Rincian Hak Komisi Tukang (1%):*\n` +
                        `${komisiDetail}\n` +
                        `----------------------------------------\n\n` +
                        `Terima kasih atas kerja samanya!`;

            window.open(`https://api.whatsapp.com/send?phone=${targetPhone}&text=${encodeURIComponent(msg)}`, '_blank');
        }

        function resetKasirUI() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('manualTrxId').value = '';
            document.getElementById('inputStrukNo').value = '';
            document.getElementById('previewContainer').classList.add('hidden');
            compressedBase64Image = "";
            currentLoadedTrx = null;
        }
    </script>
</body>
</html>
