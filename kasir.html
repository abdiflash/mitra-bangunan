<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Pemindai - Mitra Bangunan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Html5-QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; transition: background-color 0.4s ease; }
        .success-flash { background-color: #10B981 !important; }
    </style>
</head>
<body id="mainBody" class="text-slate-800 min-h-screen pb-12">

    <!-- HEADER NAVIGATION (DENGAN INDIKATOR CABANG AKTIF) -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-teal-500 flex items-center justify-center font-black text-lg text-slate-950">
                    <i class="fa-solid fa-cash-register"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base leading-tight">Kasir Pemindai QR</h1>
                    <p class="text-xs text-teal-300">Verifikasi Diskon & Transaksi Toko</p>
                </div>
            </div>
            
            <!-- IDENTITAS CABANG DITAMPAKAN DI HEADER -->
            <div class="text-right bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
                <span class="text-[10px] font-bold text-slate-400 block uppercase tracking-wider">Status Cabang</span>
                <strong id="activeStoreHeader" class="text-xs font-black text-emerald-400 block">
                    <i class="fa-solid fa-store text-amber-400"></i> Memuat Cabang...
                </strong>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-4 space-y-4">

        <!-- CAMERA SCANNER & MANUAL SEARCH -->
        <section class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-slate-200 text-center space-y-4">
            <h2 class="font-extrabold text-slate-900 text-sm sm:text-base flex items-center justify-center gap-2">
                <i class="fa-solid fa-qrcode text-teal-600"></i> Pindai / Scan QR Invoice Pembeli
            </h2>

            <div id="readerBox" class="max-w-sm mx-auto overflow-hidden rounded-2xl border-2 border-dashed border-teal-400 bg-slate-50 p-2 min-h-[220px] flex flex-col justify-center items-center">
                <div id="reader" class="w-full"></div>
            </div>

            <div class="flex justify-center gap-2">
                <button id="btnStartScan" onclick="startScanner()" class="bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-camera"></i> Buka Kamera HP/Laptop
                </button>
                <button id="btnStopScan" onclick="stopScanner()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs px-4 py-2.5 rounded-xl hidden transition">
                    Matikan Kamera
                </button>
            </div>

            <!-- Manual Input Fallback (Auto-Focus USB Scanner Ready) -->
            <div class="pt-3 border-t border-slate-100 max-w-sm mx-auto">
                <label class="block text-xs font-semibold text-slate-500 mb-1">
                    <i class="fa-solid fa-barcode text-slate-700"></i> Masukkan Kode / Scan via USB Hardware:
                </label>
                <div class="flex gap-2">
                    <input type="text" id="manualTrxId" onkeypress="handleEnterKey(event)" placeholder="Contoh: MB-759889" class="w-full bg-slate-50 border-2 border-teal-500 rounded-xl p-2.5 text-xs font-bold uppercase focus:bg-white focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-200">
                    <button id="btnCariManual" onclick="lookupManualTrx()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow transition flex items-center justify-center gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-magnifying-glass"></i> Cari
                    </button>
                </div>
            </div>
        </section>

        <!-- TRANSACTION DETAIL & CASHIER ACTION BOX -->
        <section id="resultSection" class="hidden bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 space-y-4 transition-all">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <div>
                    <span id="resTrxId" class="text-xs font-extrabold text-teal-700 uppercase tracking-wider block">MB-000000</span>
                    <h3 id="resCustName" class="text-base font-black text-slate-900">Pelanggan: Umum</h3>
                </div>
                <span id="resStatusBadge" class="bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full border border-amber-200">PENDING</span>
            </div>

            <!-- INSTRUCTION BOX UNTUK KASIR -->
            <div id="cashierInstructionCard" class="p-4 rounded-2xl border-2 space-y-1">
                <strong id="instructionTitle" class="text-sm font-black uppercase flex items-center gap-2">
                    <i class="fa-solid fa-circle-info"></i> INSTRUKSI KASIR:
                </strong>
                <p id="instructionText" class="text-xs font-bold leading-relaxed"></p>
            </div>

            <!-- TABEL DETAIL MATERIAL -->
            <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-100 font-bold text-slate-700 border-b border-slate-200">
                        <tr>
                            <th class="p-2.5">Nama Material</th>
                            <th class="p-2.5 text-center">Qty</th>
                            <th class="p-2.5 text-right">Harga</th>
                            <th class="p-2.5 text-right">Total</th>
                        </tr>
                    </thead>
                    <tbody id="resTableBody" class="divide-y divide-slate-100">
                    </tbody>
                </table>
            </div>

            <!-- FORM OTENTIKASI & AKUNTABILITAS KASIR -->
            <div id="cashierAuthBox" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                <h4 class="text-xs font-extrabold text-slate-800 uppercase tracking-wide flex items-center gap-1.5">
                    <i class="fa-solid fa-user-shield text-teal-600"></i> Akuntabilitas Pembayaran & Kasir Verifikator
                </h4>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Nama Kasir Bertugas <span class="text-red-500">*</span></label>
                        <input type="text" id="inputCashierName" placeholder="Contoh: Budi (Shift Pagi)" class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs font-semibold focus:border-teal-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">PIN Kasir Toko <span class="text-red-500">*</span></label>
                        <input type="text" id="inputCashierPin" inputmode="numeric" autocomplete="off" placeholder="Masukkan PIN 4-digit" maxlength="6" class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs font-semibold focus:border-teal-600 focus:outline-none" style="-webkit-text-security: disc;">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">No. Struk / Ref Pembayaran <span class="text-red-500">*</span></label>
                        <input type="text" id="inputStrukNo" placeholder="Contoh: STR-98123 / EDC-0912" class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs font-semibold focus:border-teal-600 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- ACTION BAR BAWAH -->
            <div class="bg-slate-900 text-white p-4 rounded-2xl flex flex-wrap items-center justify-between gap-3 shadow-md">
                <div class="space-y-0.5">
                    <span id="labelFinalTotal" class="text-xs text-slate-400 font-bold block">Tagihan Kasir / Pembayaran:</span>
                    <strong id="resFinalTotal" class="text-xl font-black text-teal-400">Rp 0</strong>
                </div>

                <div id="actionBarButtons" class="flex flex-wrap items-center gap-2">
                    <button id="btnVerify" onclick="verifyTrx()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-xs sm:text-sm px-5 py-3 rounded-xl shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-base"></i> SELESAIKAN TRANSAKSI
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        // HARDCODED BACKEND API
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxsQQMYsvWk6R3AkPhkEURDsxFaEyUnqwFyCv500uPYvK0Y0RhPvaHXgw5OcvYeH_tC/exec";

        let html5QrcodeScanner = null;
        let currentLoadedTrx = null;
        let waSentState = false;
        let activeStoreObj = null;

        window.addEventListener('DOMContentLoaded', async () => {
            await initStoreBranchHeader();
            autoFocusInput();
        });

        function autoFocusInput() {
            const inputManual = document.getElementById('manualTrxId');
            if (inputManual) {
                inputManual.focus();
                inputManual.select();
            }
        }

        async function initStoreBranchHeader() {
            const urlParams = new URLSearchParams(window.location.search);
            const pathSlug = window.location.pathname.replace(/^\/|\/$/g, '');
            const queryStore = urlParams.get('storeId') || urlParams.get('store') || urlParams.get('s');
            const targetStore = (queryStore || pathSlug).toLowerCase();

            let stores = JSON.parse(localStorage.getItem('mb_stores_cache')) || [
                { id: 'majujayamakmur-001-jkt', name: 'TB. Maju Jaya Makmur 1' },
                { id: 'majujayamakmur-002-jkt', name: 'TB. Maju Jaya Makmur 2' }
            ];

            const headerElem = document.getElementById('activeStoreHeader');

            if (targetStore && targetStore !== 'kasir.html' && targetStore !== 'index.html') {
                activeStoreObj = stores.find(s => (s.id || '').toLowerCase() === targetStore || (s.slug || '').toLowerCase() === targetStore);
            }

            if (activeStoreObj) {
                headerElem.innerHTML = `<i class="fa-solid fa-store text-amber-400"></i> ${activeStoreObj.name}`;
            } else {
                headerElem.innerHTML = `<i class="fa-solid fa-store text-emerald-400"></i> Multi-Toko Kasir Active`;
            }
        }

        // BEEP AUDIO FEEDBACK SINTESIS (TANPA FILE EKSTERNAL)
        function playBeepSound(type = 'success') {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime); // Note A5
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'double_beep') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1046.5, ctx.currentTime); // Note C6
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) { console.log('Audio disabled/not supported'); }
        }

        function triggerVisualFeedback() {
            playBeepSound('double_beep');
            const body = document.getElementById('mainBody');
            body.classList.add('success-flash');
            setTimeout(() => {
                body.classList.remove('success-flash');
            }, 600);
        }

        function startScanner() {
            document.getElementById('btnStartScan').classList.add('hidden');
            document.getElementById('btnStopScan').classList.remove('hidden');

            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                onScanSuccess
            ).catch(err => alert("Gagal membuka kamera: " + err));
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('btnStartScan').classList.remove('hidden');
                    document.getElementById('btnStopScan').classList.add('hidden');
                });
            }
        }

        function onScanSuccess(decodedText) {
            stopScanner();
            playBeepSound('success');
            let parsedId = decodedText;
            try {
                const parsed = JSON.parse(decodedText);
                if (parsed.trx) parsedId = parsed.trx;
            } catch(e) {}

            document.getElementById('manualTrxId').value = parsedId;
            fetchTrxDetails(parsedId);
        }

        function handleEnterKey(e) {
            if (e.key === 'Enter') {
                lookupManualTrx();
            }
        }

        function lookupManualTrx() {
            const val = document.getElementById('manualTrxId').value.trim().toUpperCase();
            if (!val) return alert('Masukkan Kode Invoice!');
            playBeepSound('success');
            fetchTrxDetails(val);
        }

        async function fetchTrxDetails(trxId) {
            if (!trxId) return;

            const btnCari = document.getElementById('btnCariManual');
            const originalBtnHtml = '<i class="fa-solid fa-magnifying-glass"></i> Cari';

            if (btnCari) {
                btnCari.disabled = true;
                btnCari.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mencari...';
            }

            const cacheKey = `mb_trx_cache_${trxId}`;
            const cachedTrxStr = localStorage.getItem(cacheKey);
            let isRenderedFromCache = false;

            if (cachedTrxStr) {
                try {
                    const cachedTrx = JSON.parse(cachedTrxStr);
                    renderTrxDetails(cachedTrx, false);
                    isRenderedFromCache = true;
                    if (btnCari) {
                        btnCari.disabled = false;
                        btnCari.innerHTML = originalBtnHtml;
                    }
                } catch(e) {}
            }

            if (GAS_WEB_APP_URL) {
                try {
                    const res = await fetch(`${GAS_WEB_APP_URL}?action=getTransaction&id=${trxId}`);
                    const data = await res.json();

                    if (data.success && data.trx) {
                        saveTrxToCache(data.trx);
                        renderTrxDetails(data.trx, !!data.limitWarning);
                    } else if (!isRenderedFromCache) {
                        alert('Transaksi tidak ditemukan di database server!');
                    }
                } catch(e) {
                    if (!isRenderedFromCache) {
                        alert('Gagal terhubung ke server: ' + e.toString());
                    }
                } finally {
                    if (btnCari) {
                        btnCari.disabled = false;
                        btnCari.innerHTML = originalBtnHtml;
                    }
                }
            }
        }

        function saveTrxToCache(trx) {
            if (!trx || !trx.id) return;
            localStorage.setItem(`mb_trx_cache_${trx.id}`, JSON.stringify(trx));
        }

        function buildSingleWaMessage(trx, cashierName, strukNo) {
            const isCashback = (trx.modeIncentive === 'CASHBACK_TUKANG' || trx.modeIncentive === 'KOMISI_TUKANG');
            const modeText = isCashback ? 'Komisi Tunai Tukang' : 'Diskon Nota Pemilik Rumah';
            const subtotal = trx.grandTotal || 0;
            const inc = trx.incentiveVal || Math.round(subtotal * 0.01);
            
            const totalFormatted = Number(subtotal).toLocaleString('id-ID');
            const incFormatted = Number(inc).toLocaleString('id-ID');
            const custName = trx.custName || 'Pelanggan';

            return `BUKTI VERIFIKASI TRANSAKSI MITRA BANGUNAN\n\n` +
                   `Halo Kak ${custName},\n` +
                   `Transaksi ID: ${trx.id} telah SELESAI.\n\n` +
                   `Total Belanja: Rp ${totalFormatted}\n` +
                   `Jenis Manfaat: ${modeText}\n` +
                   `Nominal Manfaat: Rp ${incFormatted}\n` +
                   `No. Struk Toko: ${strukNo || '-'}\n` +
                   `Kasir: ${cashierName || 'Kasir Toko'}\n\n` +
                   `Terima kasih telah berbelanja di Toko Mitra Bangunan!`;
        }

        function renderTrxDetails(trx, isLimitExceeded = false) {
            currentLoadedTrx = trx;
            const resSec = document.getElementById('resultSection');
            resSec.classList.remove('hidden');

            document.getElementById('resTrxId').innerText = trx.id;
            document.getElementById('resCustName').innerText = `Pelanggan: ${trx.custName || 'Umum'}`;

            const isDone = String(trx.status).toUpperCase() === 'SELESAI' || String(trx.status).toUpperCase() === 'LUNAS';
            const badge = document.getElementById('resStatusBadge');
            badge.innerText = isDone ? 'SELESAI' : 'PENDING';
            badge.className = isDone
                ? 'bg-emerald-100 text-emerald-800 text-xs font-extrabold px-3 py-1 rounded-full border border-emerald-200'
                : 'bg-amber-100 text-amber-800 text-xs font-extrabold px-3 py-1 rounded-full border border-amber-200';

            const card = document.getElementById('cashierInstructionCard');
            const title = document.getElementById('instructionTitle');
            const text = document.getElementById('instructionText');

            let subtotal = trx.grandTotal || 0;
            let inc = trx.incentiveVal || Math.round(subtotal * 0.01);
            const isCashback = (trx.modeIncentive === 'CASHBACK_TUKANG' || trx.modeIncentive === 'KOMISI_TUKANG');

            if (!isDone && isLimitExceeded) {
                card.className = "p-4 rounded-2xl border-2 bg-red-50 border-red-500 text-red-900";
                title.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-600"></i> LAYANAN DITANGGUHKAN (WAJIB SETOR KOMISI)`;
                text.innerHTML = `Akumulasi komisi platform terutang toko telah melampaui batas limit (≥ Rp 500.000).<br><strong class="text-red-700">Minta Pemilik Toko untuk melunasi setoran via QRIS / Transfer Bank di toko.html agar verifikasi kasir dapat dibuka kembali.</strong>`;
                document.getElementById('resFinalTotal').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
            } else if (isDone) {
                card.className = "p-4 rounded-2xl border-2 bg-emerald-50 border-emerald-400 text-emerald-900";
                if (isCashback) {
                    title.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i> STATUS: SELESAI (KOMISI TUNAI TELAH DISERAHKAN)`;
                    text.innerHTML = `Komisi tunai sebesar <strong>Rp ${inc.toLocaleString('id-ID')}</strong> telah diserahkan ke Tukang/Broker ${trx.cashierName ? '(Kasir: ' + trx.cashierName + ')' : ''}.<br>Ref Struk: <strong>${trx.strukNo || '-'}</strong>`;
                    document.getElementById('resFinalTotal').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
                } else {
                    title.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i> STATUS: SELESAI (NOTA DIPOTONG DISKON 1%)`;
                    text.innerHTML = `Nota telah dipotong diskon 1% sebesar <strong>Rp ${inc.toLocaleString('id-ID')}</strong> ${trx.cashierName ? '(Kasir: ' + trx.cashierName + ')' : ''}.<br>Ref Struk: <strong>${trx.strukNo || '-'}</strong>`;
                    document.getElementById('resFinalTotal').innerText = `Rp ${(subtotal - inc).toLocaleString('id-ID')}`;
                }
            } else {
                if (isCashback) {
                    card.className = "p-4 rounded-2xl border-2 bg-amber-50 border-amber-400 text-amber-900";
                    title.innerHTML = `<i class="fa-solid fa-hand-holding-dollar text-amber-600"></i> MODE: KOMISI TUNAI TUKANG / BROKER`;
                    text.innerHTML = `1. TERIMA PEMBAYARAN UTUH: <strong>Rp ${subtotal.toLocaleString('id-ID')}</strong>.<br>2. <strong>SERAHKAN KOMISI TUNAI RP ${inc.toLocaleString('id-ID')} KE TUKANG.</strong>`;
                    document.getElementById('resFinalTotal').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
                } else {
                    card.className = "p-4 rounded-2xl border-2 bg-emerald-50 border-emerald-400 text-emerald-900";
                    title.innerHTML = `<i class="fa-solid fa-percent text-emerald-600"></i> MODE: DISKON NOTA PEMILIK RUMAH`;
                    text.innerHTML = `POTONG NOTA 1% (Rp ${inc.toLocaleString('id-ID')}).<br><strong>TAGIHKAN KE PEMBELI: Rp ${(subtotal - inc).toLocaleString('id-ID')}</strong>`;
                    document.getElementById('resFinalTotal').innerText = `Rp ${(subtotal - inc).toLocaleString('id-ID')}`;
                }
            }

            const tbody = document.getElementById('resTableBody');
            tbody.innerHTML = '';
            (trx.items || []).forEach(it => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-2.5 font-bold">${it.name}</td>
                        <td class="p-2.5 text-center">${it.qty} ${it.unit}</td>
                        <td class="p-2.5 text-right">Rp ${Number(it.price || 0).toLocaleString('id-ID')}</td>
                        <td class="p-2.5 text-right font-bold text-teal-700">Rp ${Number(it.total || 0).toLocaleString('id-ID')}</td>
                    </tr>
                `;
            });

            const authBox = document.getElementById('cashierAuthBox');
            const actionBarButtons = document.getElementById('actionBarButtons');

            if (isDone) {
                authBox.classList.add('hidden');
                
                const btnNextClass = waSentState 
                    ? "bg-teal-500 hover:bg-teal-600 text-slate-950 font-black cursor-pointer shadow" 
                    : "bg-slate-800 text-slate-500 font-bold opacity-50 cursor-not-allowed";

                actionBarButtons.innerHTML = `
                    <button onclick="sendWaResi()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-3 rounded-xl shadow inline-flex items-center gap-1.5 transition">
                        <i class="fa-brands fa-whatsapp text-sm"></i> Kirim Resi WA
                    </button>
                    <button id="btnNextTrx" ${!waSentState ? 'disabled' : ''} onclick="resetKasirUI()" class="${btnNextClass} text-xs sm:text-sm px-5 py-3 rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-qrcode"></i> Transaksi Baru / Scan Lagi
                    </button>
                `;
            } else if (isLimitExceeded) {
                authBox.classList.add('hidden');
                actionBarButtons.innerHTML = `
                    <button disabled class="bg-slate-700 text-slate-400 font-extrabold text-xs sm:text-sm px-5 py-3 rounded-xl cursor-not-allowed flex items-center gap-2">
                        <i class="fa-solid fa-lock"></i> VERIFIKASI DITANGGUHKAN (CEK DASHBOARD TOKO)
                    </button>
                `;
            } else {
                authBox.classList.remove('hidden');
                actionBarButtons.innerHTML = `
                    <button id="btnVerify" onclick="verifyTrx()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-xs sm:text-sm px-5 py-3 rounded-xl shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-base"></i> SELESAIKAN TRANSAKSI
                    </button>
                `;
            }

            resSec.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        async function verifyTrx() {
            if (!currentLoadedTrx) return;

            const nameEl = document.getElementById('inputCashierName');
            const pinEl = document.getElementById('inputCashierPin');
            const strukEl = document.getElementById('inputStrukNo');

            const cashierName = nameEl ? nameEl.value.trim() : '';
            const pin = pinEl ? pinEl.value.trim() : '';
            const strukNo = strukEl ? strukEl.value.trim() : '';

            if (!cashierName) {
                alert('Nama Kasir wajib diisi!');
                if (nameEl) nameEl.focus();
                return;
            }

            if (!pin) {
                alert('PIN Kasir Toko wajib diisi!');
                if (pinEl) pinEl.focus();
                return;
            }

            if (!strukNo) {
                alert('Nomor Struk / Ref Pembayaran Toko wajib diisi!');
                if (strukEl) strukEl.focus();
                return;
            }

            const isCashback = (currentLoadedTrx.modeIncentive === 'CASHBACK_TUKANG' || currentLoadedTrx.modeIncentive === 'KOMISI_TUKANG');
            const inc = currentLoadedTrx.incentiveVal || Math.round((currentLoadedTrx.grandTotal || 0) * 0.01);

            const msgConfirm = isCashback 
                ? `Konfirmasi transaksi SELESAI?\nKasir: "${cashierName}"\nNo. Struk: "${strukNo}"\nPastikan Komisi Tunai Rp ${inc.toLocaleString('id-ID')} SUDAH DISERAHKAN ke Tukang.`
                : `Konfirmasi transaksi SELESAI?\nKasir: "${cashierName}"\nNo. Struk: "${strukNo}"\nNota telah dipotong diskon Rp ${inc.toLocaleString('id-ID')}.`;

            if (!confirm(msgConfirm)) return;

            const payload = {
                action: 'verifyTransaction',
                trxId: currentLoadedTrx.id,
                storeId: currentLoadedTrx.storeId,
                pin: pin,
                cashierName: cashierName,
                strukNo: strukNo
            };

            if (GAS_WEB_APP_URL) {
                try {
                    const response = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const res = await response.json();

                    if (!res.success) {
                        alert('Gagal Verifikasi: ' + res.message);
                        return;
                    }
                } catch(e) {
                    alert('Kesalahan koneksi server: ' + e.toString());
                    return;
                }
            }

            triggerVisualFeedback();

            currentLoadedTrx.status = 'SELESAI';
            currentLoadedTrx.cashierName = cashierName;
            currentLoadedTrx.strukNo = strukNo;
            saveTrxToCache(currentLoadedTrx);
            
            renderTrxDetails(currentLoadedTrx, false);
        }

        function sendWaResi() {
            if (!currentLoadedTrx) return;

            let targetPhone = String(currentLoadedTrx.custPhone || '').replace(/[^0-9]/g, '');
            if (targetPhone.startsWith('0')) targetPhone = '62' + targetPhone.slice(1);
            else if (targetPhone.startsWith('8')) targetPhone = '62' + targetPhone;

            if (!targetPhone || targetPhone === '-' || targetPhone.length < 8) {
                alert('Nomor WA pelanggan tidak valid/tidak tersedia.');
            } else {
                const singleMsg = buildSingleWaMessage(currentLoadedTrx, currentLoadedTrx.cashierName || '', currentLoadedTrx.strukNo || '');
                const waUrl = `https://api.whatsapp.com/send?phone=${targetPhone}&text=${encodeURIComponent(singleMsg)}`;
                window.open(waUrl, '_blank');
            }

            waSentState = true;
            const btnNext = document.getElementById('btnNextTrx');
            if (btnNext) {
                btnNext.disabled = false;
                btnNext.className = "bg-teal-500 hover:bg-teal-600 text-slate-950 font-black text-xs sm:text-sm px-5 py-3 rounded-xl shadow transition flex items-center gap-2 cursor-pointer";
            }
        }

        function resetKasirUI() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('manualTrxId').value = '';
            currentLoadedTrx = null;
            waSentState = false;

            const nameInput = document.getElementById('inputCashierName');
            const pinInput = document.getElementById('inputCashierPin');
            const strukInput = document.getElementById('inputStrukNo');
            if (nameInput) nameInput.value = '';
            if (pinInput) pinInput.value = '';
            if (strukInput) strukInput.value = '';

            autoFocusInput();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
